name: Cargo

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-job:
    name: Linux
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --release

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: shimoheihei-linux-cli
        path: target/release/shimoheihei
        archive: false

  windows-job:
    name: Windows
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose --release

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: shimoheihei-windows-cli
        path: target/release/shimoheihei.exe
        archive: false
