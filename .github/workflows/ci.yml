name: Cargo build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.artifact_name }})
    runs-on: ${{ matrix.os }}

    # so we can compile linux arm
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: shimoheihei-linux-x86_64
            binary_path: target/x86_64-unknown-linux-gnu/release/shimoheihei

          - os: ubuntu-latest
            target: i686-unknown-linux-gnu
            artifact_name: shimoheihei-linux-i686
            binary_path: target/i686-unknown-linux-gnu/release/shimoheihei

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: shimoheihei-linux-aarch64
            binary_path: target/aarch64-unknown-linux-gnu/release/shimoheihei

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: shimoheihei-windows-x86_64.exe
            binary_path: target/x86_64-pc-windows-msvc/release/shimoheihei.exe

          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact_name: shimoheihei-windows-i686.exe
            binary_path: target/i686-pc-windows-msvc/release/shimoheihei.exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: shimoheihei-windows-aarch64.exe
            binary_path: target/aarch64-pc-windows-msvc/release/shimoheihei.exe

          - os: macos-latest
            target: universal
            artifact_name: shimoheihei-macos-universal
            binary_path: target/release/shimoheihei

    steps:
    - uses: actions/checkout@v7

    - name: Install Linux cross compiler headers
      if: runner.os == 'Linux'
      run: |
          sudo apt-get update
          if [ "${{ matrix.target }}" = "i686-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-multilib
          elif [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Install Rust targets
      run: |
          if [ "${{ matrix.target }}" = "universal" ]; then
            rustup target add x86_64-apple-darwin aarch64-apple-darwin
          else
            rustup target add ${{ matrix.target }}
          fi
      shell: bash

    - name: Build
      run: |
          if [ "${{ matrix.target }}" = "universal" ]; then
            cargo build --verbose --release --target x86_64-apple-darwin
            cargo build --verbose --release --target aarch64-apple-darwin
            mkdir -p target/release
            lipo -create \
              -output target/release/shimoheihei \
              target/x86_64-apple-darwin/release/shimoheihei \
              target/aarch64-apple-darwin/release/shimoheihei
          else
            cargo build --verbose --release --target ${{ matrix.target }}
          fi

          cp ${{ matrix.binary_path }} target/${{ matrix.artifact_name }}
      shell: bash

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        # upload-artifact with archive set to false will IGNORE the name parameter . why ??????????
        path: target/${{ matrix.artifact_name }}
        archive: false
