[package]
name = "cli"
version = "0.1.0"
edition = "2024"

[dependencies]
smhh = { path = "../smhh" }
clap = { version = "4.5.48", features = ["derive"] }
anyhow = "1.0.100"
image = "0.25.9"
rayon = "1.11.0"
bytesize = "2.3.1"
humantime = "2.3.0"
indicatif = { version = "0.18.4", features = ["rayon"] }
console = "0.16.2"
minus = { version = "5.7.2", features = ["dynamic_output"] }

[[bin]]
name = "shimoheihei"
path = "src/main.rs"
